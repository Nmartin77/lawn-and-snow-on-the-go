<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawn and Snow on the Go for Crews</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
<header><a class="brand" href="index.html" style="text-decoration:none">Lawn and Snow <i>on the Go</i></a><div id="who"></div></header>
<div id="map" class="map"></div><main id="app"></main><footer class="meta" style="margin-top:32px"><a href="terms.html">Terms of service</a> · <a href="privacy.html">Privacy policy</a></footer></div>
<script type="module">
import { sb, $, esc, usd, PLANS, est, api, boot, makeMap, uploadPhotos, photoUrls, thumbs, geocode, myLocation, miles } from "./common.js";
boot("company", async (me) => {
  let reqs = [], mine = [], pays = [], pu = {}, area = null, hereLoc = null, cust = {}, note = "", watch = null, last = 0, mp = null, pins = [];
  const app = $("#app");
  // Shrink phone photos before upload (max 1600 px, JPEG).
  const shrink = (file) => new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u);
      cv.toBlob((b) => (b ? res(b) : rej(new Error("Could not read that photo."))), "image/jpeg", 0.82);
    };
    img.onerror = () => rej(new Error("Could not read that photo."));
    img.src = u;
  });
  if (!me.charges_enabled && me.stripe_account_id) { try { me.charges_enabled = (await api("refresh")).charges_enabled; } catch (e) {} }

  const job = (r) => {
    const q = mine.find((x) => x.request_id === r.id), per = r.plan === "once" ? "job" : "visit";
    return `<article class="job"><h3>${esc(r.service)}</h3><div class="meta">${esc(r.address)} · ${r.size_sqft.toLocaleString()} sq ft · ${PLANS[r.plan]}${area && r.lat ? " · " + miles(area.lat, area.lng, r.lat, r.lng).toFixed(1) + " mi away" : ""} · by ${esc(r.preferred_date || "")}</div>
      ${r.notes ? `<p class="meta">${esc(r.notes)}</p>` : ""}${thumbs(r.photos, pu)}
      ${q ? `<div class="quote"><span>You quoted · you keep ${usd(q.price_cents * 0.85)}</span><span class="price">${usd(q.price_cents)}${r.plan === "once" ? "" : "/visit"}</span></div>${thumbs(q.photos, pu)}`
        : `<form class="row" data-rid="${r.id}"><input name="price" type="number" min="1" step="0.01" value="${est(r.service, r.size_sqft)}" aria-label="Price in dollars"><input name="msg" placeholder="Short message" aria-label="Message"><label style="flex-basis:100%;margin:0">Photos for your quote, such as similar past work (optional, up to 6)<input type="file" name="qphotos" accept="image/*" multiple></label><button class="btn sm">Send quote</button></form>
           <p class="meta">Price per ${per}. You keep 85% after the 15% platform fee.</p>`}</article>`;
  };
  const when = (d) => new Date(d).toLocaleDateString();
  const hm = (d) => new Date(d).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  const local = (d) => { const t = new Date(d); return new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
  // Arrival time and the 2-hour window to finish.
  const schedule = (p) => {
    const late = p.window_ends_at && Date.now() > Date.parse(p.window_ends_at);
    const info = p.arrived_at ? `Arrived ${hm(p.arrived_at)}. Finish by ${hm(p.window_ends_at)}${late ? ". You are past the 2-hour window" : ""}.`
      : p.eta_at ? `ETA sent: ${hm(p.eta_at)}. You have a 2-hour window to finish, until ${hm(p.window_ends_at)}.`
      : "Tell the customer when you will arrive. You then have a 2-hour window to finish the job.";
    return `<form class="panel" data-eta="${p.id}"><p class="meta">${info}</p>${p.arrived_at ? "" : `<label>Estimated arrival<input type="datetime-local" name="eta" value="${p.eta_at ? local(p.eta_at) : ""}" required></label>
      <p style="margin-top:12px"><button class="btn sm">${p.eta_at ? "Update ETA" : "Send ETA to customer"}</button> <button type="button" class="btn sm ghost" data-act="arrive" data-id="${p.id}">I have arrived</button></p>`}</form>`;
  };
  const visit = (p) => p.status === "released"
    ? `<div class="quote"><span>Paid out ${usd(p.crew_cents)} on ${when(p.released_at)}</span><span class="tag">Paid</span></div>`
    : p.status === "review" ? `<p class="meta">Finished. The customer has until ${new Date(p.review_ends_at).toLocaleString()} to approve or report a problem. Your ${usd(p.crew_cents)} is released after that.</p>`
    : p.status === "disputed" ? `<p class="meta">On hold: the customer reported a problem. We will review the photos and contact you.</p>`
    : p.status === "refunded" ? `<p class="meta">Refunded to the customer.</p>`
    : p.status === "releasing" ? `<p class="meta">Releasing your payout...</p>`
    : schedule(p) + `<form class="panel" data-pid="${p.id}"><p class="meta">The customer paid ${usd(p.amount_cents - (p.service_fee_cents || 0))} for the job. You receive ${usd(p.crew_cents)} after you finish the job, upload photos, and the customer approves or 48 hours pass.</p>
        <label>Photos of the finished work (required)<input type="file" name="photos" accept="image/*" multiple required></label>
        <label>Notes (optional)<input name="notes" maxlength="500"></label><button class="btn sm" style="margin-top:12px">Finish job and get paid</button></form>`;
  const won = (r) => {
    const c = cust[r.customer_id] || {}, ps = pays.filter((p) => p.request_id === r.id);
    return `<article class="job"><div class="job-h"><div><strong>${esc(r.service)}</strong><p class="meta">${esc(c.name || "Customer")} · ${esc(c.phone || "")}<br>${esc(r.address)} · ${PLANS[r.plan]}</p></div><span class="tag">${r.status === "done" ? "Complete" : "Active"}</span></div>
      ${ps.length ? ps.map(visit).join("") : `<p class="meta">Waiting for the customer\u2019s payment to finish processing.</p>`}</article>`;
  };
  const areaForm = () => `<form id="af"><p class="meta">${area
      ? `You see open jobs within ${area.radius_miles} mile${area.radius_miles === 1 ? "" : "s"} of ${esc(area.label || "your base")}.`
      : "Set your service area to start seeing jobs near you."}</p>
    <label>Base address<input name="addr" value="${esc(area?.label || "")}" placeholder="Street, city, state"></label>
    <label>Service radius (up to 10 miles)<select name="radius">${[1, 2, 3, 5, 7, 10].map((n) => `<option value="${n}" ${n === (area?.radius_miles || 10) ? "selected" : ""}>${n} mile${n === 1 ? "" : "s"}</option>`).join("")}</select></label>
    <p style="margin-top:12px"><button class="btn sm">Save service area</button> <button type="button" class="btn sm ghost" data-act="useloc">Use my current location</button></p></form>`;
  const render = () => {
    const open = reqs.filter((r) => r.status === "open");
    const wonJobs = reqs.filter((r) => ["booked", "done"].includes(r.status) && mine.some((q) => q.id === r.booked_quote));
    app.innerHTML = (note ? `<p class="panel" role="status">${esc(note)}</p>` : "")
      + (me.charges_enabled ? "" : `<div class="panel"><h2>Set up payouts</h2><p class="meta">Connect a bank account with Stripe to receive 85% of each job. You can send quotes now, but customers can only book you once payouts are active.</p><button class="btn" data-act="onboard">Set up payouts</button></div>`)
      + `<div class="grid"><section><h2>Open jobs</h2>${open.length ? open.map(job).join("") : `<p class="empty">No open jobs right now.</p>`}</section>
        <section class="panel"><h2>${esc(me.company_name)}</h2>${areaForm()}
        <label class="chk"><input type="checkbox" id="loc" ${watch !== null ? "checked" : ""}> Share my live location with booked customers</label>
        <h3 style="margin-top:16px">Active jobs</h3>${wonJobs.length ? wonJobs.map(won).join("") : `<p class="meta">Win a quote and it shows up here.</p>`}</section></div>`;
  };
  const drawMap = (me_pos) => {
    if (!mp) return;
    pins.forEach((x) => x.setMap(null)); pins = [];
    reqs.filter((r) => r.lat && r.status === "open").forEach((r) => pins.push(new mp.m.Marker({ map: mp.map, position: { lat: r.lat, lng: r.lng }, title: r.service })));
    if (area) {
      pins.push(new mp.m.Circle({ map: mp.map, center: { lat: area.lat, lng: area.lng }, radius: area.radius_miles * 1609.34, strokeColor: "#1F5233", fillColor: "#1F5233", fillOpacity: 0.08 }));
      mp.map.setCenter({ lat: area.lat, lng: area.lng });
    }
  };
  const load = async () => {
    const [r, q, pm, ar] = await Promise.all([sb.from("requests").select("*").order("created_at", { ascending: false }), sb.from("quotes").select("*").eq("company_id", me.id), sb.from("payments").select("*").order("created_at", { ascending: false }), sb.from("crew_areas").select("*").eq("company_id", me.id).maybeSingle()]);
    reqs = r.data || []; mine = q.data || []; pays = pm.data || []; area = ar.data || null;
    pu = await photoUrls([...reqs.flatMap((x) => x.photos || []), ...mine.flatMap((x) => x.photos || [])]);
    const ids = [...new Set(reqs.map((x) => x.customer_id))];
    cust = Object.fromEntries(((await sb.from("profiles").select("id,name,phone").in("id", ids)).data || []).map((p) => [p.id, p]));
    render(); drawMap();
  };

  app.onclick = async (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    try {
      if (b.dataset.act === "useloc") { hereLoc = await myLocation(); b.textContent = "Location set. Now save your service area."; return; }
      if (b.dataset.act === "arrive") { await api("arrive", { payment_id: +b.dataset.id }); note = "Marked as arrived. Your 2-hour window has started."; await load(); return; }
      if (b.dataset.act === "onboard") location.href = (await api("onboard")).url;
      if (b.dataset.act === "done") { await sb.rpc("complete_request", { rid: +b.dataset.id }); await load(); }
    } catch (x) { note = x.message; render(); }
  };
  app.onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (e.target.dataset.eta) {
      try {
        await api("eta", { payment_id: +e.target.dataset.eta, eta_at: new Date(f.get("eta")).toISOString() });
        note = "ETA sent to the customer.";
      } catch (x) { note = x.message; }
      return load();
    }
    if (e.target.id === "af") {
      try {
        const addr = String(f.get("addr") || "").trim(), ll = hereLoc || await geocode(addr);
        if (!ll.lat) throw new Error("We couldn\u2019t find that address. Add the city and state, or use your current location.");
        const { error } = await sb.from("crew_areas").upsert({ company_id: me.id, lat: ll.lat, lng: ll.lng, radius_miles: +f.get("radius"), label: addr || "Current location", updated_at: new Date().toISOString() });
        if (error) throw error;
        hereLoc = null; note = "Service area saved.";
      } catch (x) { note = x.message; }
      return load();
    }
    if (e.target.dataset.pid) {
      const pid = +e.target.dataset.pid, files = f.getAll("photos").filter((x) => x.size).slice(0, 10), btn = e.target.querySelector("button");
      btn.disabled = true; btn.textContent = "Uploading...";
      try {
        const paths = [];
        for (const [i, file] of files.entries()) {
          const path = `${me.id}/${pid}/${Date.now()}-${i}.jpg`;
          const { error } = await sb.storage.from("job-photos").upload(path, await shrink(file), { contentType: "image/jpeg" });
          if (error) throw error;
          paths.push(path);
        }
        await api("complete", { payment_id: pid, notes: f.get("notes"), photos: paths });
        note = "Job finished. Your payout is on its way.";
      } catch (x) { note = x.message; }
      return load();
    }
    let photos = [];
    try { photos = await uploadPhotos(f.getAll("qphotos"), me.id); } catch (x) { note = x.message; return load(); }
    const { error } = await sb.from("quotes").insert({ request_id: +e.target.dataset.rid, company_id: me.id, price_cents: Math.round(+f.get("price") * 100), message: f.get("msg"), photos });
    note = error ? error.message : "Quote sent."; await load();
  };
  app.onchange = (e) => {
    if (e.target.id !== "loc") return;
    if (e.target.checked) {
      watch = navigator.geolocation.watchPosition((p) => {
        if (Date.now() - last < 10000) return; last = Date.now();
        sb.from("crew_locations").upsert({ company_id: me.id, lat: p.coords.latitude, lng: p.coords.longitude, updated_at: new Date().toISOString() });
      }, () => { note = "Location permission was denied."; navigator.geolocation.clearWatch(watch); watch = null; render(); }, { enableHighAccuracy: true });
    } else { navigator.geolocation.clearWatch(watch); watch = null; sb.from("crew_locations").delete().eq("company_id", me.id).then(() => {}); }
  };

  makeMap($("#map")).then((m) => { mp = m; drawMap(); });
  sb.channel("co").on("postgres_changes", { event: "*", schema: "public", table: "requests" }, load)
    .on("postgres_changes", { event: "*", schema: "public", table: "quotes" }, load)
    .on("postgres_changes", { event: "*", schema: "public", table: "payments" }, load).subscribe();
  api("sweep").catch(() => {}).then(load);
});
</script></body></html>
